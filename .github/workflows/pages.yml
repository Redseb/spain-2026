name: pages

# Publishes the files at the root of this repo to GitHub Pages.
#
# `enablement: true` turns Pages on through the API on the first run, so the
# site goes live without anyone touching repository settings. If the repo's
# default workflow permissions are too restrictive for that, this step is
# where it fails — enable Pages by hand under Settings → Pages and the rest
# of the workflow works unchanged.
#
# The custom domain is deliberately not set here. mikozyz.dev belongs to the
# redseb.github.io user site, and project sites inherit it automatically as
# <domain>/<repo>. Adding a CNAME would try to claim the domain for this repo
# and take the portfolio down with it.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
